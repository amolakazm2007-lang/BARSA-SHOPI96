name: BARSA SHOPI Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HAS_SIGNING_KEY: ${{ secrets.BARSA_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify web engine
        run: |
          npm ci --no-audit --no-fund
          npm run prepare:runtime
          npm run verify:runtime
          npm test
          npm run check
          npm run final:audit
          npm run build
          node scripts/sync-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          BARSA_KEYSTORE_B64: ${{ secrets.BARSA_KEYSTORE_B64 }}
        run: echo "$BARSA_KEYSTORE_B64" | base64 --decode > barsa-release.jks
      - name: Sign release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KS_PASS: ${{ secrets.BARSA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BARSA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BARSA_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks barsa-release.jks --ks-pass pass:"$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASS" --out BARSA-SHOPI-v9.8.1-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose BARSA-SHOPI-v9.8.1-release.apk
      - name: Use unsigned artifact when signing secrets are absent
        if: env.HAS_SIGNING_KEY != 'true'
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk BARSA-SHOPI-v9.8.1-release-UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BARSA-SHOPI-v9.8.1-release
          path: BARSA-SHOPI-v9.8.1-release*.apk
          if-no-files-found: error
          retention-days: 30
