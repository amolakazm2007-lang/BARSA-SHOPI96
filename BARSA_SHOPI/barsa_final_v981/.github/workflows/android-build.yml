name: BARSA SHOPI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify runtime assets
        run: npm run prepare:runtime && npm run verify:runtime

      - name: Test engine
        run: npm test

      - name: Audit source
        run: |
          npm run check
          npm run final:audit

      - name: Build web runtime
        run: npm run build

      - name: Sync Android assets
        run: node scripts/sync-android.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARSA-SHOPI-v9.8.1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
